images:
  backend:
    repository: ghcr.io/reing01/sicose-backend
    tag: latest
    pullPolicy: Always
  frontend:
    repository: ghcr.io/reing01/sicose-frontend
    tag: latest
    pullPolicy: Always

global:
  namespace: sicose-prod

ingress:
  enabled: true
  className: nginx
  host: sicose-practica.local

backend:
  replicaCount: 12

frontend:
  replicaCount: 12

autoscaling:
  enabled: false

pdb:
  enabled: true
  minAvailable: 9

config:
  corsOrigin: http://sicose-practica.local
