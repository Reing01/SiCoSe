x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env.docker
  volumes:
    - ./backend:/app
    - backend_node_modules:/app/node_modules

services:
  migrate:
    <<: *backend-common
    container_name: sicose-migrate
    restart: "no"
    command: ["sh", "-c", "npm run prisma:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red-datos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sicose-frontend
    env_file:
      - .env.docker
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - red-publica
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  backend:
    <<: *backend-common
    container_name: sicose-backend
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - red-publica
      - red-privada
      - red-datos
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: sicose-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red-datos
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: sicose-redis
    restart: unless-stopped
    env_file:
      - .env.docker
    command: ["sh", "-c", "exec redis-server --appendonly \"$$REDIS_APPENDONLY\""]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - red-privada
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  red-publica:
    driver: bridge
  red-privada:
    driver: bridge
  red-datos:
    driver: bridge

volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data:
  redis_data:
