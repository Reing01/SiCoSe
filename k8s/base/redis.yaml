apiVersion: v1
kind: Service
metadata:
  name: sicose-redis
  namespace: sicose-prod
spec:
  clusterIP: None
  selector:
    app: sicose
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sicose-redis
  namespace: sicose-prod
spec:
  serviceName: sicose-redis
  replicas: 1
  selector:
    matchLabels:
      app: sicose
      component: redis
  template:
    metadata:
      labels:
        app: sicose
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          envFrom:
            - configMapRef:
                name: sicose-config
          command:
            - sh
            - -c
            - exec redis-server --appendonly "$REDIS_APPENDONLY"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
