version: "3.8"

services:
  edge:
    image: ${SICOSE_EDGE_IMAGE:-ghcr.io/reing01/sicose-frontend:latest}
    ports:
      - target: 8080
        published: ${SICOSE_HTTP_PORT:-80}
        protocol: tcp
        mode: ingress
    configs:
      - source: edge_proxy
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    networks:
      - frontend
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/routing-mesh-health | grep -q '^ok$$'",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: ${SICOSE_EDGE_REPLICAS:-4}
      endpoint_mode: vip
      placement:
        max_replicas_per_node: 1
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.25"
          memory: 128M

  frontend:
    image: ${SICOSE_FRONTEND_IMAGE:-ghcr.io/reing01/sicose-frontend:latest}
    networks:
      - frontend
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: ${SICOSE_FRONTEND_REPLICAS:-12}
      endpoint_mode: vip
      placement:
        max_replicas_per_node: 3
        preferences:
          - spread: node.id
      update_config:
        parallelism: 2
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 2
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      resources:
        reservations:
          cpus: "0.05"
          memory: 64M
        limits:
          cpus: "0.25"
          memory: 128M

  backend:
    image: ${SICOSE_BACKEND_IMAGE:-ghcr.io/reing01/sicose-backend:latest}
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="$$(cat /run/secrets/database_url)"
        export DIRECT_URL="$$DATABASE_URL"
        export JWT_SECRET="$$(cat /run/secrets/jwt_secret)"
        export SUPABASE_URL="$$(cat /run/secrets/supabase_url)"
        export SUPABASE_SERVICE_KEY="$$(cat /run/secrets/supabase_service_key)"
        exec node dist/src/index.js
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: ${SICOSE_PUBLIC_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${SICOSE_COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${SICOSE_TRUST_PROXY_HOPS:-1}
      REDIS_URL: redis://redis:6379
      JWT_ISSUER: sicose
      JWT_EXPIRES_IN: 8h
      REFRESH_TOKEN_EXPIRES: 7d
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "10"
      RATE_LIMIT_EMAIL_WINDOW_MS: "300000"
      RATE_LIMIT_EMAIL_MAX: "5"
      SUPABASE_STORAGE_BUCKET: ${SICOSE_SUPABASE_STORAGE_BUCKET:-comprobantes}
    secrets:
      - source: database_url
        target: database_url
      - source: jwt_secret
        target: jwt_secret
      - source: supabase_url
        target: supabase_url
      - source: supabase_service_key
        target: supabase_service_key
    networks:
      - frontend
      - data
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: ${SICOSE_BACKEND_REPLICAS:-12}
      endpoint_mode: vip
      placement:
        max_replicas_per_node: 3
        preferences:
          - spread: node.id
      update_config:
        parallelism: 2
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 2
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      resources:
        reservations:
          cpus: "0.10"
          memory: 256M
        limits:
          cpus: "0.50"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SICOSE_POSTGRES_DB:-sicose_prod}
      POSTGRES_USER: ${SICOSE_POSTGRES_USER:-sicose_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        target: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        reservations:
          cpus: "0.10"
          memory: 256M
        limits:
          cpus: "0.50"
          memory: 1G

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        reservations:
          cpus: "0.05"
          memory: 128M
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  frontend:
    driver: overlay
    driver_opts:
      encrypted: "true"
  data:
    driver: overlay
    driver_opts:
      encrypted: "true"
    attachable: true
    internal: true

volumes:
  postgres_data:
  redis_data:

configs:
  edge_proxy:
    external: true
    name: ${SICOSE_EDGE_PROXY_CONFIG}

secrets:
  postgres_password:
    external: true
    name: ${SICOSE_POSTGRES_PASSWORD_SECRET}
  database_url:
    external: true
    name: ${SICOSE_DATABASE_URL_SECRET}
  jwt_secret:
    external: true
    name: ${SICOSE_JWT_SECRET_NAME}
  supabase_url:
    external: true
    name: ${SICOSE_SUPABASE_URL_SECRET}
  supabase_service_key:
    external: true
    name: ${SICOSE_SUPABASE_SERVICE_KEY_SECRET}
