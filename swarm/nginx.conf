map $http_x_forwarded_proto $sicose_forwarded_proto {
  default $scheme;
  http http;
  https https;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $sicose_frontend http://frontend:8080;
  set $sicose_backend http://backend:3000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /routing-mesh-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass $sicose_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sicose_forwarded_proto;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
  }

  location / {
    proxy_pass $sicose_frontend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sicose_forwarded_proto;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
  }
}
