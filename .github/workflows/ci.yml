name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Install ${{ matrix.service }} dependencies from lockfile
        run: pnpm --dir ${{ matrix.service }} install --frozen-lockfile
      - name: Run ${{ matrix.service }} lint checks
        run: pnpm --dir ${{ matrix.service }} run lint

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Install ${{ matrix.service }} dependencies from lockfile
        run: pnpm --dir ${{ matrix.service }} install --frozen-lockfile
      - name: Run ${{ matrix.service }} critical route tests
        run: pnpm --dir ${{ matrix.service }} run test

  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Install ${{ matrix.service }} dependencies from lockfile
        run: pnpm --dir ${{ matrix.service }} install --frozen-lockfile
      - name: Build ${{ matrix.service }}
        run: pnpm --dir ${{ matrix.service }} run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create CI Docker environment from safe example values
        run: cp .env.docker.example .env.docker
      - name: Build root production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sicose:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Docker Compose configuration with example variables
        run: docker compose config --quiet
      - name: Build Docker Compose services
        run: docker compose build

  helm:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint SiCoSe Helm chart
        run: helm lint ./helm/sicose
      - name: Render SiCoSe Helm chart with default values
        run: helm template sicose ./helm/sicose --namespace sicose --debug > /tmp/sicose-manifest.yaml
